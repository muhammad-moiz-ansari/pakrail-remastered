<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Designify · Part A structural prototype</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      font: 16px system-ui;
      max-width: 1000px;
      margin: auto;
      padding: 24px;
      color: #222;
      background: #eee;
    }
    header,
    main,
    aside {
      background: white;
      border: 2px solid #555;
      padding: 24px;
      margin: 20px 0;
    }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button,
    input,
    select {
      font: inherit;
      padding: 12px;
      margin: 6px;
      border: 1px solid #555;
      background: #fff;
    }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }
    label {
      display: block;
      margin: 16px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .box {
      border: 1px solid;
      padding: 16px;
      margin: 12px 0;
    }
    a {
      color: #222;
    }
    small {
      display: block;
    }
    @media (max-width: 600px) {
      .grid {
        display: block;
      }
    }</style
  ><a href="#main">Skip to content</a>
  <header>
    <b>DESIGNIFY / PART A</b>
    <p>
      Preserved grayscale structural prototype · Proposed — awaiting card-sort
      validation
    </p>
    <nav id="nav"></nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <aside>
    This independent early prototype explores information order and error
    recovery. It uses fictional content and is not a usability finding.
    <a href="/">Open green Part B</a>
  </aside>
  <script>
    const names = [
      "Search",
      "Passengers",
      "Rank and ticket type",
      "Seats",
      "Ticket preview",
      "Payment",
      "Booking confirmed",
    ];
    let n = 0;
    const content = [
      `<label>Departure <input placeholder="Lahore Junction"></label><label>Arrival <input placeholder="Rawalpindi"></label><label>Date <input type="date"></label><label>Adults <select><option>1</option><option>2</option><option>3</option></select></label>
      <div class="box">Demo train · 08:00 → 12:30 · PKR 2,400 <label><input type="radio" name="train"> Select train</label></div><button onclick="error()">Explore no-results branch</button><div class="box">Route preview — placeholder</div>`,
      `<label>Passenger name <input placeholder="Fictional traveller"></label><label>Contact email <input type="email" placeholder="traveller@example.com"></label>`,
      `<label><input type="radio" name="class"> Economy · PKR 2,400</label><label><input type="radio" name="class"> AC Standard · PKR 3,840</label><label><input type="radio" name="class"> Business · PKR 5,280</label>`,
      `<p>Suggested seats are selected. Choose a different seat to change.</p><div class="box">Coach A · [✓ Passenger 1] [Free] [Sold] [Free]</div><label>Alternative seat <select><option>A · 1</option><option>A · 2</option><option>B · 1</option></select></label><button onclick="error()">Explore seat-conflict branch</button>`,
      `<div class="box">Journey / train / class<br>Travellers / coach / seat<br>Contact / total</div><label>Optional voucher <input placeholder="DEMO10"></label>`,
      `<p>Demo payment — no money will be charged.</p><div class="box">Total: PKR 2,400</div><button onclick="error()">Explore payment-failure branch</button>`,
      `<div class="box">Demo booking confirmed<br>Reference: DEMO-WIREFRAME<br>Traveller / journey / seat / total</div><button onclick="window.print()">Print summary</button>`,
    ];
    function render() {
      document.querySelector("#nav").innerHTML = names
        .map(
          (s, i) =>
            `<button aria-current="${i === n ? "step" : "false"}" onclick="go(${i})">S${i + 1} ${s}</button>`,
        )
        .join("");
      const isLastStep = n === names.length - 1;
      document.querySelector("#main").innerHTML =
        `<small>Screen S${n + 1} / ${names.length}</small><h1>${names[n]}</h1>${content[n]}<hr><button onclick="go(${Math.max(0, n - 1)})">Back</button><button onclick="go(${isLastStep ? 0 : n + 1})">${isLastStep ? "Start new booking" : names[n] === "Payment" ? "Pay — demo" : "Continue"}</button>`;
    }
    function go(i) {
      n = i;
      render();
      document.querySelector("#main").focus();
    }
    function error() {
      document.querySelector("#main").innerHTML =
        '<h1>Something needs attention</h1><p role="alert">This is the alternate error route. Your previous choices are retained in the full prototype.</p><button onclick="go(n)">Retry / return to current screen</button>';
    }
    render();
  </script>
</html>
